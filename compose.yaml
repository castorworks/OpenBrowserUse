services:
  browser:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      OBU_API_HOST: 0.0.0.0
      OBU_API_PORT: 4319
      OBU_DATA_DIR: /data
      BROWSER_HEADLESS: '1'
      BROWSER_CHANNEL: chromium
    ports:
      - '${OBU_PUBLISH_HOST:-127.0.0.1}:${OBU_PUBLISH_PORT:-4319}:4319'
    volumes:
      - browser-data:/data
    shm_size: 1gb
    stop_grace_period: 30s
volumes:
  browser-data:
